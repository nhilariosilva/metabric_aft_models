[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metabric-aft-models"
version = "0.1.0"
description = "Cure AFT models for the METABRIC breast cancer cohort"
requires-python = ">=3.10"
dependencies = [
    "ipython",
    "lifelines",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "scikit-learn",
    "scikit-survival",
    "scipy",
    "seaborn",
    "silence-tensorflow",
    "tensorflow",
    "tensorflow-probability",
    "tf-keras",
    "thetaflow",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
